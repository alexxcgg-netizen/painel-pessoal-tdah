<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Configurar PIN - Painel Pessoal</title>

  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/css/login.css" />
  <meta name="theme-color" content="#0d0f14" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body data-modo="configurar">
  <div class="aurora" aria-hidden="true"></div>
  <main class="cartao">
    <div class="icone-cadeado">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="11" rx="2.5" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
      </svg>
    </div>
    <h1>Primeiro acesso</h1>
    <p class="subtitulo">Escolha um PIN de 6 dígitos - só você vai saber ele. Guarda num lugar seguro (gerenciador de senhas), não dá pra recuperar se esquecer.</p>

    <div class="pin-grupo" id="pin-grupo">
      <span class="pin-grupo-rotulo">PIN</span>
      <div class="pin-linha">
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" autofocus />
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
      </div>
    </div>

    <div class="pin-grupo" id="confirmacao-grupo" style="margin-top: 1rem">
      <span class="pin-grupo-rotulo">Confirma</span>
      <div class="pin-linha">
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
        <input class="pin-caixa" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
      </div>
    </div>

    <p class="mensagem" id="mensagem"></p>
    <div class="espera" id="espera" hidden><span></span><span></span><span></span></div>
  </main>

  <script src="/static/js/login.js"></script>
</body>
</html>

      <div class="card painel-secao-card">
      <h2 style="--secao-cor: var(--cor-financeiro)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l1.5-4L12 17l2-8 1.5 3H21"/></svg>
        Saúde hoje
      </h2>
      <p id="saude-oculto-visitante" class="dica-metas" hidden>Oculto no modo visitante.</p>
      <p id="saude-vazio" class="dica-metas">
        Sem dados hoje ainda - configure um Atalho no iPhone pra mandar passos/sono automaticamente
        (veja o README).
      </p>
      <div id="saude-grid" class="stats-grid" hidden>
        <div class="stat-tile stat-tile-saude" data-campo="passos">
          <span class="stat-tile-valor" id="saude-passos">-</span>
          <span class="stat-tile-label">passos</span>
        </div>
        <div class="stat-tile stat-tile-saude" data-campo="distancia">
          <span class="stat-tile-valor" id="saude-distancia">-</span>
          <span class="stat-tile-label">km andados</span>
        </div>
        <div class="stat-tile stat-tile-saude" data-campo="sono">
          <span class="stat-tile-valor" id="saude-sono">-</span>
          <span class="stat-tile-label">h de sono</span>
        </div>
      </div>
      <p id="dica-sono" class="dica-metas" hidden></p>
      <p id="dica-humor" class="dica-metas" hidden></p>

      <div class="hidratacao-linha">
        <span class="hidratacao-contador"><span id="hidratacao-total">0</span> copo(s) hoje</span>
        <button type="button" id="hidratacao-btn" class="btn-com-icone hidratacao-btn-grande">
          <span class="hidratacao-nivel" id="hidratacao-nivel" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/></svg>
          +1 copo de água
        </button>
      </div>
      </div>

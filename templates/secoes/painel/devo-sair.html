      <div class="card painel-secao-card">
      <h2 style="--secao-cor: var(--cor-tarefas)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m14.8 9.2-1.6 4-4 1.6 1.6-4 4-1.6Z"/></svg>
        Devo sair ate que horas?
      </h2>
      <p class="dica-metas">Considera transito em tempo real (precisa do Google Maps configurado - veja o README).</p>
      <form id="viagem-form" style="--form-cor: var(--cor-tarefas)">
        <div class="viagem-rota">
          <span class="viagem-rota-trilha" aria-hidden="true"></span>
          <div class="viagem-rota-campo">
            <span class="viagem-rota-ponto viagem-rota-ponto-origem" aria-hidden="true"></span>
            <input type="text" id="viagem-origem" placeholder="De onde? (deixa em branco se tiver endereco padrao)" />
          </div>
          <div class="viagem-rota-campo">
            <span class="viagem-rota-ponto viagem-rota-ponto-destino" aria-hidden="true"></span>
            <input type="text" id="viagem-destino" placeholder="Pra onde?" required />
          </div>
        </div>
        <label class="campo-rotulo-wrap">
          <span class="campo-rotulo">Chegar ate</span>
          <input type="datetime-local" id="viagem-chegar" required />
        </label>
        <button type="submit" id="viagem-btn" class="btn-com-icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m14.8 9.2-1.6 4-4 1.6 1.6-4 4-1.6Z"/></svg>
          Calcular
        </button>
      </form>
      <div id="viagem-resultado" class="card-resultado card-resultado-viagem" hidden></div>
      <div class="viagem-links">
        <a id="viagem-waze" class="btn-waze" href="#" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/><path d="M15 6h3a2 2 0 0 1 2 2v10"/></svg>
          Abrir no Waze
        </a>
        <a id="viagem-uber" class="btn-uber" href="#" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M7 17v-4.5L9 8h6l2 4.5V17"/><circle cx="8.5" cy="17" r="1.6"/><circle cx="15.5" cy="17" r="1.6"/></svg>
          Pedir Uber
        </a>
      </div>
      <p class="dica-metas dica-uber" id="viagem-uber-dica" hidden>
        Abre o app da Uber com o destino ja preenchido - o pedido e a corrida voce confirma la, o painel nao tem acesso a conta nem pode pedir sozinho.
      </p>
      </div>

      <h2 class="secao-secundaria" style="--secao-cor: var(--cor-bancos)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4M8 8l4-4 4 4"/><path d="M4.5 15.5V18a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2.5"/></svg>
        Importar extrato (OFX)
      </h2>
      <form id="importar-form">
        <select id="banco-select">
          <option value="nubank">Nubank</option>
          <option value="caixa">Caixa</option>
          <option value="viacredi">Viacredi</option>
          <option value="bradesco">Bradesco</option>
          <option value="outro">Outro</option>
        </select>
        <select id="tipo-select">
          <option value="conta">Conta</option>
          <option value="cartao">Cartao de credito</option>
        </select>
        <input type="file" id="ofx-input" accept=".ofx,.qfx" required />
        <label for="ofx-input" id="ofx-input-label" class="ofx-input-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4M8 8l4-4 4 4"/><path d="M4.5 15.5V18a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2.5"/></svg>
          <span>Escolher extrato (.ofx, .qfx)</span>
        </label>
        <button type="submit" id="importar-btn" class="btn-com-icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V4M8 8l4-4 4 4"/><path d="M4.5 15.5V18a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2.5"/></svg>
          Importar extrato
        </button>
      </form>
      <p id="bancos-status" class="stat-linha"></p>
      <p id="cripto-aviso" class="vazio" hidden>
        Criptografia em repouso desligada - saldo/extrato estao em texto plano no banco.
        Configure ENCRYPTION_KEY pra ligar (veja docs/SEGURANCA.md).
      </p>
      <p id="bancos-vazio" class="vazio" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6"/><path d="M4 10h16v2H4z"/><path d="M5 12v7M9.5 12v7M14.5 12v7M19 12v7"/><path d="M3.5 21h17"/></svg>
        Nenhum extrato importado ainda. Exporta um OFX do app do banco e joga aqui.
      </p>

      <section class="secao-recolhivel" data-aberto="true" data-secao-id="construtora-cotacoes" style="--secao-cor: var(--cor-construtora)">
        <button type="button" class="secao-cabecalho" aria-expanded="true" aria-controls="conteudo-construtora-cotacoes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12.5l2 2 4-5"/><rect x="3.5" y="4" width="17" height="16" rx="2"/></svg>
          Cotacoes
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div class="secao-conteudo" id="conteudo-construtora-cotacoes">
          <div class="dica-colapsavel">
            <button type="button" class="dica-toggle" aria-expanded="false" aria-label="Ver explicacao das cotacoes"></button>
            <p class="dica-metas dica-texto" hidden>
              Compare preços de fornecedor de material de obra. Fala no chat ("fornecedor tal, R$5000,
              pra cotacao de ferro") ou anexa o PDF do orcamento direto aqui.
            </p>
          </div>
          <button type="button" id="cotacao-abrir-btn" class="btn btn-adicionar">Nova cotacao</button>
          <p id="cotacoes-oculto-visitante" class="vazio" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            Oculto no modo visitante.
          </p>
          <p id="cotacoes-vazio" class="vazio" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 12.5l2 2 4-5"/><rect x="3.5" y="4" width="17" height="16" rx="2"/></svg>
            Nenhuma cotacao ainda.
          </p>
          <ul id="lista-cotacoes"></ul>
        </div>
      </section>

      <div class="bottom-sheet" id="cotacao-sheet" aria-labelledby="cotacao-sheet-titulo" hidden>
        <h3 id="cotacao-sheet-titulo" class="sheet-titulo">Nova cotacao</h3>
        <form id="cotacao-form" class="sheet-form">
          <label class="campo-rotulo" for="cotacao-titulo">Material ou serviço</label>
          <input type="text" id="cotacao-titulo" class="campo" placeholder="Ex: portas, ferro" maxlength="120" required />
          <div class="sheet-acoes">
            <button type="button" id="cotacao-cancelar-btn" class="btn btn-secundario">Cancelar</button>
            <button type="submit" id="cotacao-btn" class="btn btn-primario">Salvar cotacao</button>
          </div>
        </form>
      </div>

      <section class="secao-recolhivel card" data-aberto="true" data-secao-id="vida-salvos">
        <h2 class="secao-secundaria" style="--secao-cor: var(--cor-tarefas)">
          <button type="button" class="secao-cabecalho" aria-expanded="true" aria-controls="conteudo-vida-salvos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>
            Salvos pra ver depois
            <span class="chevron" aria-hidden="true"></span>
          </button>
        </h2>
        <div class="secao-conteudo" id="conteudo-vida-salvos">
          <button type="button" id="salvo-abrir-btn" class="btn btn-adicionar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Salvar link
          </button>
          <p id="salvos-vazio" class="vazio" hidden>Nenhum link salvo.</p>
          <ul id="lista-salvos" class="lista-simples"></ul>
        </div>
      </section>

      <div class="bottom-sheet" id="sheet-salvo" hidden>
        <div class="bottom-sheet-cabecalho">
          <h3 class="card-titulo">Salvar link pra depois</h3>
          <button type="button" id="salvo-fechar-btn" class="bottom-sheet-fechar" aria-label="Fechar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <form id="salvo-form" class="form-linha">
          <input type="text" id="salvo-url" placeholder="Cola o link (artigo ou video)" inputmode="url" maxlength="2000" required />
          <button type="submit" id="salvo-btn" class="btn btn-primario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Salvar e resumir</button>
        </form>
      </div>

      <section class="secao-recolhivel vida-acabamento" data-aberto="true" data-secao-id="vida-ideias-presente" style="--secao-cor: var(--cor-painel)">
        <button type="button" class="secao-cabecalho" aria-expanded="true" aria-controls="conteudo-vida-ideias-presente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7Z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7Z"/></svg>
          Ideias de presente
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div class="secao-conteudo" id="conteudo-vida-ideias-presente">
          <div class="dica-colapsavel">
            <button type="button" class="dica-toggle" aria-expanded="false" aria-label="Ver explicação de ideias de presente"></button>
            <p class="dica-metas dica-texto" hidden>
              Anota ideia de presente pra uma pessoa ao longo do ano - marca "comprado" quando resolver, pra não esquecer na hora certa.
            </p>
          </div>
          <button type="button" id="ideia-presente-abrir-btn" class="btn btn-adicionar">Adicionar ideia</button>
          <p id="ideias-presente-vazio" class="vazio" hidden>Nenhuma ideia guardada.</p>
          <ul id="lista-ideias-presente"></ul>
        </div>
      </section>

      <div class="bottom-sheet" id="sheet-ideia-presente" hidden aria-labelledby="sheet-ideia-presente-titulo">
        <h3 class="bottom-sheet-titulo" id="sheet-ideia-presente-titulo">Adicionar ideia de presente</h3>
        <form id="ideia-presente-form" class="form-linha">
          <input type="text" id="ideia-presente-pessoa" class="campo" placeholder="Pra quem?" maxlength="80" required />
          <input type="text" id="ideia-presente-ideia" class="campo" placeholder="Ideia de presente" maxlength="200" required />
          <input type="text" id="ideia-presente-ocasiao" class="campo" placeholder="Ocasiao (opcional)" maxlength="60" />
          <div class="form-linha">
            <button type="submit" id="ideia-presente-btn" class="btn btn-primario btn-com-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Salvar ideia</button>
            <button type="button" id="ideia-presente-cancelar-btn" class="btn btn-secundario">Cancelar</button>
          </div>
        </form>
      </div>

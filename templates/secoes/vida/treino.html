      <section class="secao-recolhivel" data-aberto="true" data-secao-id="vida-treino" style="--secao-cor: var(--cor-hoje)">
        <button type="button" class="secao-cabecalho" aria-expanded="true" aria-controls="conteudo-vida-treino">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
          Treino
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div class="secao-conteudo" id="conteudo-vida-treino">
          <div class="dica-colapsavel">
            <button type="button" class="dica-toggle" aria-expanded="false" aria-label="Ver explicacao de treino"></button>
            <p class="dica-metas dica-texto" hidden>
              Uma ficha por grupo muscular. Tarefa de treino com o nome do grupo (ex: "Treino peito") ganha um botao ! que mostra a ficha. No chat: cola o treino ou fala "treinei costas 1h".
            </p>
          </div>
          <button type="button" id="ficha-abrir-btn" class="btn btn-adicionar">Nova ficha</button>
          <p id="fichas-vazio" class="vazio" hidden>Nenhuma ficha ainda.</p>
          <ul id="lista-fichas"></ul>
          <p id="treinos-recentes" class="dica-metas" hidden></p>
        </div>
      </section>

      <div class="bottom-sheet" id="sheet-ficha" hidden>
        <form id="ficha-form" class="form-linha">
          <input type="text" id="ficha-grupo" placeholder="Grupo (ex: Peito)" maxlength="40" required />
          <input type="text" id="ficha-ex-nome" placeholder="Exercicio (ex: Supino reto)" maxlength="80" />
          <input type="number" id="ficha-ex-series" placeholder="Series" min="1" max="30" inputmode="numeric" />
          <input type="text" id="ficha-ex-reps" placeholder="Reps (ex: 10 ou 8-12)" maxlength="20" />
          <input type="text" id="ficha-ex-carga" placeholder="Carga (opcional)" maxlength="30" />
          <button type="button" id="ficha-ex-add-btn" class="btn-com-icone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Adicionar exercicio
          </button>
          <p id="ficha-exercicios-vazio" class="dica-metas ficha-exercicios-vazio">Nenhum exercicio adicionado ainda - monte a ficha um exercicio por vez.</p>
          <ul id="ficha-exercicios-pendentes" class="ficha-exercicios-pendentes"></ul>
          <div class="form-linha">
            <button type="submit" id="ficha-btn" class="btn btn-primario btn-com-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12.5l2 2 4-5"/><circle cx="12" cy="12" r="9"/></svg>Salvar ficha</button>
            <button type="button" id="ficha-cancelar-btn" class="btn btn-secundario">Cancelar</button>
          </div>
        </form>
      </div>

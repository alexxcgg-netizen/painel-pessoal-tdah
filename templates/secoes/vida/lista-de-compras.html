      <section class="secao-recolhivel vida-acabamento" data-aberto="true" data-secao-id="vida-lista-de-compras" style="--secao-cor: var(--cor-financeiro)">
        <button type="button" class="secao-cabecalho" aria-expanded="true" aria-controls="conteudo-vida-lista-de-compras">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>

          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div class="secao-conteudo" id="conteudo-vida-lista-de-compras">

          <button type="button" id="compra-abrir-btn" class="btn btn-adicionar">Adicionar item</button>

          </div>
        </form>

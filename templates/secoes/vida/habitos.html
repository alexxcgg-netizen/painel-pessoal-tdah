      <h2 id="vida-habitos" class="secao-secundaria" style="--secao-cor: var(--cor-painel)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="13" r="8"/><path d="M9 2h6M12 2v3"/></svg>
        Hábitos
      </h2>
      <div class="dica-colapsavel">
        <button type="button" class="dica-toggle" aria-expanded="false" aria-label="Ver explicação de hábitos"></button>
        <p class="dica-metas dica-texto" hidden>
          Diferente da rotina guiada (manhã/noite) - um hábito seu, com meta e frequência próprias:
          todo dia, dias fixos da semana ou X vezes por semana (qualquer dia conta). Marca dia a dia,
          mostra os últimos 7 dias. No chat: "meditar 15 min todo dia às 8h".
        </p>
      </div>
      <button type="button" id="habito-abrir-btn" class="btn btn-adicionar">
        Novo hábito
      </button>

      <div class="bottom-sheet" id="habito-sheet" hidden aria-labelledby="habito-sheet-titulo">
        <h3 class="bottom-sheet-titulo" id="habito-sheet-titulo">Novo hábito</h3>
        <form id="habito-form" class="form-linha">
          <input type="text" id="habito-nome" class="campo" placeholder="Hábito (ex: Meditar)" maxlength="80" required />
          <input type="text" id="habito-meta" class="campo" placeholder="Meta (opcional, ex: 15 min)" maxlength="60" />
          <select id="habito-frequencia-tipo" class="campo" aria-label="Frequência">
            <option value="diario">Todo dia</option>
            <option value="dias_semana">Dias fixos da semana</option>
            <option value="n_vezes_semana">X vezes por semana</option>
          </select>
          <div id="habito-dias-semana-campo" class="habito-dias-semana" hidden>
            <label><input type="checkbox" value="0" />Seg</label>
            <label><input type="checkbox" value="1" />Ter</label>
            <label><input type="checkbox" value="2" />Qua</label>
            <label><input type="checkbox" value="3" />Qui</label>
            <label><input type="checkbox" value="4" />Sex</label>
            <label><input type="checkbox" value="5" />Sab</label>
            <label><input type="checkbox" value="6" />Dom</label>
          </div>
          <input type="number" id="habito-vezes-semana" class="campo" placeholder="Quantas vezes por semana" min="1" max="7" inputmode="numeric" hidden />
          <input type="time" id="habito-horario" class="campo" aria-label="Horário de lembrete (opcional)" />
          <div class="form-linha">
            <button type="submit" id="habito-btn" class="btn btn-primario btn-com-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Salvar hábito</button>
            <button type="button" id="habito-cancelar-btn" class="btn btn-secundario">Cancelar</button>
          </div>
        </form>
      </div>

      <p id="habitos-vazio" class="vazio" hidden>Nenhum hábito cadastrado.</p>
      <ul id="lista-habitos" class="lista-habitos"></ul>

      <section class="secao-recolhivel" data-aberto="true" data-secao-id="vida-lugares" style="--secao-cor: var(--cor-aviacao)">
        <button type="button" class="secao-cabecalho" aria-expanded="true" aria-controls="conteudo-vida-lugares">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>
          Lugares que gostei
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div class="secao-conteudo" id="conteudo-vida-lugares">
          <div class="dica-colapsavel">
            <button type="button" class="dica-toggle" aria-expanded="false" aria-label="Ver explicacao de lugares que gostei"></button>
            <p class="dica-metas dica-texto" hidden>
              Restaurante, hotel, bar - pra lembrar de novo quando voltar pra mesma cidade (aparece junto da viagem).
            </p>
          </div>
          <button type="button" id="lugar-abrir-btn" class="btn btn-adicionar">Novo lugar</button>
          <p id="lugares-vazio" class="vazio" hidden>Nenhum lugar guardado.</p>
          <ul id="lista-lugares"></ul>
        </div>
      </section>

      <div class="bottom-sheet" id="lugar-sheet" aria-labelledby="lugar-sheet-titulo" hidden>
        <h3 id="lugar-sheet-titulo" class="sheet-titulo">Novo lugar</h3>
        <form id="lugar-form" class="sheet-form">
          <label class="campo-rotulo" for="lugar-nome">Nome do lugar</label>
          <input type="text" id="lugar-nome" class="campo" placeholder="Ex: Cafe da Praca" maxlength="80" required />
          <label class="campo-rotulo" for="lugar-cidade">Cidade (opcional)</label>
          <input type="text" id="lugar-cidade" class="campo" placeholder="Ex: Blumenau" maxlength="60" />
          <div class="sheet-acoes">
            <button type="button" id="lugar-cancelar-btn" class="btn btn-secundario">Cancelar</button>
            <button type="submit" id="lugar-btn" class="btn btn-primario">Salvar lugar</button>
          </div>
        </form>
      </div>

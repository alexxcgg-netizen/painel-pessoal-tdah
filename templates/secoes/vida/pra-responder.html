      <section class="secao-recolhivel card" data-aberto="true" data-secao-id="vida-pra-responder">
        <h2 class="secao-secundaria" style="--secao-cor: var(--cor-tarefas)">
          <button type="button" class="secao-cabecalho" aria-expanded="true" aria-controls="conteudo-vida-pra-responder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v1a5 5 0 0 1-5 5h-2"/></svg>
            Pra responder
            <span class="chevron" aria-hidden="true"></span>
          </button>
        </h2>
        <div class="secao-conteudo" id="conteudo-vida-pra-responder">
          <div class="dica-colapsavel">
            <button type="button" class="dica-toggle" aria-expanded="false" aria-label="Ver explicacao de pra responder"></button>
            <p class="dica-metas dica-texto" hidden>
              Mensagem importante que VOCE precisa responder e deixou pra depois. Lembra todo dia as 10h ate voce marcar "respondi". No chat: "tenho que responder o Joao sobre o orcamento".
            </p>
          </div>
          <button type="button" id="responder-abrir-btn" class="btn btn-adicionar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Adicionar pendencia
          </button>
          <p id="responder-vazio" class="vazio" hidden>Nada pendente pra responder.</p>
          <ul id="lista-responder" class="lista-simples"></ul>
        </div>
      </section>

      <div class="bottom-sheet" id="sheet-responder" hidden>
        <div class="bottom-sheet-cabecalho">
          <h3 class="card-titulo">Nova pendencia pra responder</h3>
          <button type="button" id="responder-fechar-btn" class="bottom-sheet-fechar" aria-label="Fechar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <form id="responder-form" class="form-linha">
          <input type="text" id="responder-quem" placeholder="Pra quem?" maxlength="60" required />
          <input type="text" id="responder-sobre" placeholder="Sobre o que? (opcional)" maxlength="200" />
          <button type="submit" id="responder-btn" class="btn btn-primario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Adicionar</button>
        </form>
      </div>

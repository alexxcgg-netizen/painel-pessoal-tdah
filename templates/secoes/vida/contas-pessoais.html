      <h2 class="secao-secundaria" style="--secao-cor: var(--cor-financeiro)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        Contas pessoais
      </h2>
      <div class="dica-colapsavel">
        <button type="button" class="dica-toggle" aria-expanded="false" aria-label="Ver explicacao de contas pessoais"></button>
        <p class="dica-metas dica-texto" hidden>
          Conta que vence todo mes (luz, internet, cartao). Avisa 3 dias antes e no dia - marque
          "paga" pra parar de avisar naquele mes. Nao tem nada a ver com as contas da construtora.
        </p>
      </div>
      <button type="button" class="btn-adicionar" id="btn-nova-conta-pessoal" aria-haspopup="dialog" aria-controls="sheet-nova-conta-pessoal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Nova conta pessoal
      </button>
      <p id="contas-pessoais-vazio" class="vazio" hidden>Nenhuma conta cadastrada.</p>
      <ul class="lista-item-lista" id="lista-contas-pessoais"></ul>

      <div class="bottom-sheet bottom-sheet-financas" id="sheet-nova-conta-pessoal" hidden>
        <div class="bottom-sheet-cabecalho">
          <h3>Nova conta pessoal</h3>
          <button type="button" class="bottom-sheet-fechar" data-fechar-sheet="sheet-nova-conta-pessoal" aria-label="Fechar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <form id="conta-pessoal-form">
          <label class="campo">
            <span class="campo-rotulo">Conta</span>
            <input type="text" id="conta-pessoal-nome" placeholder="Internet, luz, cartao..." maxlength="80" required />
          </label>
          <label class="campo">
            <span class="campo-rotulo">Dia do vencimento (1-31)</span>
            <input type="number" id="conta-pessoal-dia" min="1" max="31" inputmode="numeric" required />
          </label>
          <label class="campo">
            <span class="campo-rotulo">Valor (opcional)</span>
            <input type="number" id="conta-pessoal-valor" step="0.01" min="0" inputmode="decimal" />
          </label>
          <button type="submit" id="conta-pessoal-btn" class="btn-com-icone btn-sheet-salvar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Adicionar
          </button>
        </form>
      </div>

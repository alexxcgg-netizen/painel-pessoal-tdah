      <section class="secao-recolhivel vida-acabamento" data-aberto="true" data-secao-id="vida-garantia" style="--secao-cor: var(--cor-bancos)">
        <button type="button" class="secao-cabecalho" aria-expanded="true" aria-controls="conteudo-vida-garantia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 7v5c0 4.5 3.4 8.4 9 10 5.6-1.6 9-5.5 9-10V7l-9-4Z"/><path d="m9 12 2 2 4-4"/></svg>
          Garantia de produtos
          <span class="chevron" aria-hidden="true"></span>
        </button>
        <div class="secao-conteudo" id="conteudo-vida-garantia">
          <div class="dica-colapsavel">
            <button type="button" class="dica-toggle" aria-expanded="false" aria-label="Ver explicação de garantia de produtos"></button>
            <p class="dica-metas dica-texto" hidden>
              Guarda o prazo de garantia de um produto (e a nota fiscal, se quiser anexar). Avisa 15 dias antes de vencer.
            </p>
          </div>
          <button type="button" id="garantia-abrir-btn" class="btn btn-adicionar">Adicionar produto</button>
          <p id="garantias-vazio" class="vazio" hidden>Nenhum produto cadastrado.</p>
          <ul id="lista-garantias"></ul>
        </div>
      </section>

      <div class="bottom-sheet" id="sheet-garantia" hidden aria-labelledby="sheet-garantia-titulo">
        <h3 class="bottom-sheet-titulo" id="sheet-garantia-titulo">Adicionar produto</h3>
        <form id="garantia-form" class="form-linha">
          <input type="text" id="garantia-produto" class="campo" placeholder="Produto (ex: Geladeira)" maxlength="120" required />
          <label class="campo-rotulo" for="garantia-data-compra">Data da compra</label>
          <input type="date" id="garantia-data-compra" class="campo" required />
          <label class="campo-rotulo" for="garantia-prazo">Garantia (meses)</label>
          <input type="number" id="garantia-prazo" class="campo" placeholder="12" min="1" max="600" inputmode="numeric" required />
          <label class="campo-rotulo" for="garantia-anexo">Nota fiscal (opcional)</label>
          <input type="file" id="garantia-anexo" class="garantia-anexo" accept=".pdf,.jpg,.jpeg,.png" />
          <div class="form-linha">
            <button type="submit" id="garantia-btn" class="btn btn-primario btn-com-icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Salvar produto</button>
            <button type="button" id="garantia-cancelar-btn" class="btn btn-secundario">Cancelar</button>
          </div>
        </form>
      </div>

      <h2 style="--secao-cor: var(--cor-tarefas)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l2.5 2.5L16 9"/></svg>
        Tarefas
      </h2>

      <button type="button" id="tarefa-abrir-btn" class="btn btn-adicionar">
        Nova tarefa
      </button>

      <div class="bottom-sheet" id="tarefa-sheet" hidden aria-labelledby="tarefa-sheet-titulo">
        <h3 class="bottom-sheet-titulo" id="tarefa-sheet-titulo">Nova tarefa</h3>
        <form id="nova-tarefa-form" class="form-linha" style="--form-cor: var(--cor-tarefas)">
          <input type="text" id="nova-tarefa-titulo" class="campo" placeholder="O que precisa ser feito?" maxlength="200" required />
          <input type="date" id="nova-tarefa-prazo" class="campo" aria-label="Prazo (opcional)" />

            </button>
            <button type="button" id="tarefa-cancelar-btn" class="btn btn-secundario">Cancelar</button>
          </div>
        </form>
      </div>

      <p class="card-vida-meta">Como ta sua energia agora?</p>
      <div class="form-linha" id="energia-botoes" role="group" aria-label="Energia agora">
        <button type="button" class="chip" data-nivel="baixa" aria-pressed="false">Baixa</button>
        <button type="button" class="chip" data-nivel="media" aria-pressed="false">Média</button>
        <button type="button" class="chip" data-nivel="alta" aria-pressed="false">Alta</button>
      </div>

        Nenhuma tarefa pendente. Ta tudo feito.
      </p>

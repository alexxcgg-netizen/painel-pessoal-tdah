      <h2 style="--secao-cor: var(--cor-tarefas)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l2.5 2.5L16 9"/></svg>
        Tarefas
      </h2>

      <button type="button" id="tarefa-abrir-btn" class="btn btn-adicionar">
        Nova tarefa
      </button>

      <div class="bottom-sheet" id="tarefa-sheet" hidden aria-labelledby="tarefa-sheet-titulo">
        <h3 class="bottom-sheet-titulo" id="tarefa-sheet-titulo">Nova tarefa</h3>
        <form id="nova-tarefa-form" class="form-linha" style="--form-cor: var(--cor-tarefas)">
          <input type="text" id="nova-tarefa-titulo" class="campo" placeholder="O que precisa ser feito?" maxlength="200" required />
          <input type="date" id="nova-tarefa-prazo" class="campo" aria-label="Prazo (opcional)" />
          <div class="form-linha">
            <button type="submit" id="nova-tarefa-btn" class="btn btn-primario btn-com-icone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              Salvar tarefa
            </button>
            <button type="button" id="tarefa-cancelar-btn" class="btn btn-secundario">Cancelar</button>
          </div>
        </form>
      </div>

      <p class="card-vida-meta">Como tá sua energia agora?</p>
      <div class="form-linha" id="energia-botoes" role="group" aria-label="Energia agora">
        <button type="button" class="chip" data-nivel="baixa" aria-pressed="false">Baixa</button>
        <button type="button" class="chip" data-nivel="media" aria-pressed="false">Média</button>
        <button type="button" class="chip" data-nivel="alta" aria-pressed="false">Alta</button>
      </div>
      <p id="sugestao-energia-vazio" class="vazio" hidden>Nenhuma tarefa compatível com esse nível agora.</p>
      <ul id="lista-sugestao-energia" class="tt-lista"></ul>

      <!-- Leva 06/11 (frente 6): o dia de hoje em uma linha + a regua do dia (linha-do-tempo-tarefas.js) -->
      <div class="tt-cab-dia">
        <h3>Hoje</h3>
        <span id="tt-cab-dia-data"></span>
      </div>
      <p class="tt-resumo" id="tt-resumo-dia"></p>
      <div class="tt-regua" id="tt-regua" role="group" aria-label="Régua do dia" hidden>
        <div class="tt-regua-trilho" id="tt-regua-trilho">
          <div class="tt-regua-linha"></div>
          <div class="tt-regua-chuva" id="tt-regua-chuva" hidden><i></i></div>
          <div class="tt-regua-agora" id="tt-regua-agora" hidden></div>
        </div>
        <div class="tt-regua-horas" id="tt-regua-horas" aria-hidden="true"></div>
        <p class="tt-regua-dica" id="tt-regua-dica"></p>
      </div>

      <p id="tarefas-vazio" class="vazio" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5L16 9"/></svg>
        Nenhuma tarefa pendente. Tá tudo feito.
      </p>
      <!-- Leva 06/11 (frente 6): grupos Atrasadas / Manha / Tarde / Noite / Sem hora / Amanha / proximos
           dias / Sem data, cada um com a sua lista (tarefas.js monta). -->
      <div id="lista-tarefas" class="tt-grupos"></div>
      <button type="button" id="tarefas-ver-mais" class="btn btn-secundario" hidden>Ver mais</button>

      <!-- M3 (uso diario): concluida some da lista acima mas NUNCA e apagada - aqui
           da pra ver de novo (busca preguicosa, so no toque) e desmarcar. -->
      <button type="button" id="tarefas-concluidas-toggle" class="btn btn-secundario" aria-expanded="false" aria-controls="lista-tarefas-concluidas">
        Ver concluídas
      </button>
      <p id="tarefas-concluidas-vazio" class="vazio" hidden>Nenhuma tarefa concluída ainda.</p>
      <ul id="lista-tarefas-concluidas" hidden></ul>

      <!-- Leva 06/11 (frente 6): folha de acoes da tarefa (folha-tarefa.js; componente ui/bottom-sheet.js) -->
      <div class="bottom-sheet tt-folha" id="tarefa-folha" hidden aria-labelledby="tt-folha-titulo">
        <h3 class="tt-folha-titulo" id="tt-folha-titulo"></h3>
        <p class="tt-folha-sub" id="tt-folha-sub"></p>
        <div class="tt-bloco">
          <p class="tt-rotulo" id="tt-folha-rot-dia">Quando</p>
          <div class="tt-chips" id="tt-folha-dias" role="group" aria-labelledby="tt-folha-rot-dia"></div>
        </div>
        <div class="tt-bloco">
          <p class="tt-rotulo" id="tt-folha-rot-hora">Hora</p>
          <div class="tt-chips" id="tt-folha-horas" role="group" aria-labelledby="tt-folha-rot-hora"></div>
        </div>
        <div class="tt-bloco">
          <label class="tt-rotulo" for="tt-folha-nome">Nome</label>
          <input class="tt-editar" id="tt-folha-nome" type="text" maxlength="200" autocomplete="off" enterkeyhint="done" />
        </div>
        <div class="tt-bloco" id="tt-folha-passos" hidden>
          <p class="tt-rotulo">Passos</p>
          <ul class="tt-passos"></ul>
        </div>
        <button type="button" class="tt-acao" id="tt-folha-feito">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
          Feito
        </button>
        <div class="tt-bloco tt-mais" id="tt-folha-mais">
          <div class="tt-chips"></div>
          <div id="tt-folha-extra"></div>
        </div>
        <button type="button" class="tt-acao perigo" id="tt-folha-apagar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>
          Apagar
        </button>
      </div>

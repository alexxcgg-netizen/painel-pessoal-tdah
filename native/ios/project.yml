# Projeto Xcode do app iOS nativo do Painel Pessoal (2026-10-22).
#
# O .xcodeproj NAO fica no repositorio: o GitHub Actions (.github/workflows/build-ios.yml) gera
# ele a partir deste arquivo com XcodeGen (https://github.com/yonaskolb/XcodeGen) num Mac da nuvem.
# Num Mac seu: `brew install xcodegen && cd native/ios && xcodegen generate && open Painel.xcodeproj`.
#
# Dois alvos:
#  - Painel: app contêiner. Uma WKWebView abrindo o painel (a mesma tela do PWA) + uma tela de
#    configuração que grava a URL e o token do widget no App Group.
#  - PainelWidgetExtension: o widget (WidgetKit) com os arquivos de native/widgetkit/.
# Os dois dividem o App Group abaixo (tem que ser igual a PainelConfig.appGroupID em Config.swift).
name: Painel
options:
  bundleIdPrefix: com.alexxcgg
  deploymentTarget:
    iOS: "16.2"  # 16.2: Live Activities (ActivityKit) sem if #available por todo lado
  createIntermediateGroups: true
settings:
  base:
    # Xcode so aceita 4.0, 4.2, 5.0 ou 6.0 aqui ("5.9" da erro "SWIFT_VERSION '5.9' is unsupported").
    # "5.0" = modo de linguagem Swift 5 (concorrencia sem checagem estrita), compilado pelo Swift do Xcode.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 2026-11-06: "dd/mm hh:mm · commit" vindo do CI (build-ios.yml); build local mostra "local"
    PAINEL_BUILD: "local"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Painel:
    type: application
    platform: iOS
    sources:
      - path: App
      # o intent do botão da Central de Controle roda dentro do app (openAppWhenRun), então o app precisa dele também
      - path: ../widgetkit/PainelControleIntent.swift
      # atributos da atividade de teste da ilha: o app liga, o widget desenha
      - path: ../widgetkit/IlhaTesteAtributos.swift
      # atividade ao vivo do próximo compromisso (04/11): o app liga/atualiza/encerra (AoVivo.swift), o widget desenha
      - path: ../widgetkit/CompromissoAtributos.swift
      # botão Feito dentro da atividade ao vivo da tarefa (06/11): o iOS roda o perform() no processo do app
      - path: ../widgetkit/FeitoAoVivoIntent.swift
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Painel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PainelBuild: $(PAINEL_BUILD)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        LSRequiresIPhoneOS: true
        # app SwiftUI com cena (o AppDelegate entrega o CenaDelegate pro atalho "Configurar" do icone)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # O painel roda em rede de casa/Tailscale; o endereco e digitado no app, entao nao da pra
        # listar dominio fixo. Mesma liberdade de um navegador comum.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: O chat do painel usa o microfone pra tu falar em vez de digitar.
        NSCameraUsageDescription: O chat do painel usa a câmera pra foto do prato e de nota.
        NSPhotoLibraryUsageDescription: O chat do painel usa fotos da galeria quando tu escolhe uma.
        NSLocationWhenInUseUsageDescription: O painel usa a localização pra hora de sair e chegada no aeroclube.
        # onde eu estou (04/11): visitas (chegou/saiu de um lugar) com o app fechado - so o lugar, nunca o caminho
        NSLocationAlwaysAndWhenInUseUsageDescription: Com “Sempre”, o painel sabe quando tu chega e sai de um lugar (mecânico, casa) e ajusta os horários das tarefas.
        # GPS mais esperto (06/11): o sensor de movimento diz quando tu esta dirigindo (Localizacao.swift)
        NSMotionUsageDescription: O painel usa o movimento do iPhone pra saber quando tu está dirigindo e ligar o GPS de estrada sozinho.
        # avisos no app (06/11): "fetch" = atualizacao em segundo plano (BGAppRefreshTask, AvisosLocais.swift);
        # "location" = GPS sempre ligado (botao do Configurar, desligado por padrao). O identificador tem que
        # bater com AvisosLocais.tarefaFundo (checar_projeto.py confere).
        UIBackgroundModes: [fetch, location]
        BGTaskSchedulerPermittedIdentifiers: [com.alexxcgg.painel.avisos]
    entitlements:
      path: App/Painel.entitlements
      properties:
        com.apple.security.application-groups: [group.com.alexxcgg.painel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexxcgg.painel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # arquivo compartilhado com o widget que precisa saber em qual alvo esta (FeitoAoVivoIntent.swift)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PAINEL_APP"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PainelWidgetExtension
        embed: true
    scheme: {}  # gera o scheme "Painel" (xcodebuild -scheme Painel no CI)
  PainelWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../widgetkit
        excludes: ["README.md"]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Painel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PainelBuild: $(PAINEL_BUILD)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PainelWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.alexxcgg.painel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexxcgg.painel.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
